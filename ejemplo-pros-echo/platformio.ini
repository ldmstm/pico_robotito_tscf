[env:esp32thing]
platform = espressif32 @ 6.12.0
board = esp32thing
framework = espidf

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
;monitor_rts = 0
;monitor_dtr = 0

board_build.cmake_extra_args =
    -DZ_FEATURE_LINK_TCP=1
    -DZ_FEATURE_LINK_SERIAL=1
    -DZ_FEATURE_LINK_UDP_UNICAST=0
    -DZ_FEATURE_LINK_UDP_MULTICAST=0

    -DZ_TRANSPORT_LEASE=60000
    -DZ_TRANSPORT_LEASE_EXPIRE_FACTOR=2

build_flags =
    -DZENOH_C_STANDARD=99
    -DZENOH_COMPILER_GCC
    -DZENOH_ESPIDF
    ; -DZENOH_LOG_DEBUG ; helpful to see Zenoh debug log
    ; -DZENOH_LOG_TRACE ; helpful to see where errors are coming from
    ; -DPICOROS_DEBUG

    -DZ_BATCH_SIZE_TX=1500
    -DZ_BATCH_UNICAST_SIZE=2048

    -DUSER_TYPE_FILE='"my_ros_types.h"'

    -I include
    -I config

lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico
    https://github.com/eProsima/Micro-CDR
    ; https://github.com/martinrugnitz/picorosso-espidf.git#main ;; Cpp version
    https://github.com/martinrugnitz/picorosso-espidf.git#rosout_fix ;; C version

    ; Pico-ROS-software debe clonarse manualmente:
    ;   cd .pio/libdeps/esp32thing
    ;   git clone https://github.com/Pico-ROS/Pico-ROS-software.git
