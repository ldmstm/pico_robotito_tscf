; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:info]
platform = espressif32
board = esp32dev
framework = espidf
build_flags = -DRUN_INFO
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:blink]
platform = espressif32
board = esp32dev
framework = espidf
build_flags = -DRUN_BLINK
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:pico]
platform = espressif32
board = esp32dev
framework = espidf
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -DRUN_PICO
    -DZENOH_ESPIDF
    -I include
    -DUSER_TYPE_FILE='"my_ros_types.h"'
    -I config

board_build.cmake_extra_args = 
    -DZ_FEATURE_LINK_TCP=1 
    -DZ_FEATURE_LINK_SERIAL=0
    -DZ_FEATURE_LINK_UDP_UNICAST=0 

lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico
    https://github.com/eProsima/Micro-CDR
    /home/ubuntu/personal/facultad_wsl/tscf_robotito/picorosso-espidf ; modify this line for your own path

    ; clone the following repos yourself in the .pio/libdeps/pico directory:
    ; https://github.com/Pico-ROS/Pico-ROS-software.git
    