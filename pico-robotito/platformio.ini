; PlatformIO Project Configuration File
;
; WiFi echo example using Pico-ROS on Sparkfun ESP32 Thing
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32thing]
platform = espressif32@6.13.0
board = esp32thing
framework = espidf

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
;monitor_rts = 0
;monitor_dtr = 0

board_build.cmake_extra_args =
    -DZ_FEATURE_LINK_TCP=1
    -DZ_FEATURE_LINK_SERIAL=0
    -DZ_FEATURE_LINK_UDP_UNICAST=0
    -DZ_TRANSPORT_LEASE=60000
    -DZ_TRANSPORT_LEASE_EXPIRE_FACTOR=2

build_flags =
    -DZENOH_C_STANDARD=99
    -DZENOH_COMPILER_GCC
    -Wno-missing-field-initializers
    -I include
    -DUSER_TYPE_FILE='"my_ros_types.h"'
    -DZENOH_ESPIDF
    -I config
    -DZ_BATCH_SIZE_TX=1500
    -DZ_BATCH_UNICAST_SIZE=2048

lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico
    https://github.com/eProsima/Micro-CDR
    https://github.com/martinrugnitz/picorosso-espidf.git#rosout_fix

    ; Pico-ROS-software debe clonarse manualmente:
    ;   cd .pio/libdeps/esp32thing
    ;   git clone https://github.com/Pico-ROS/Pico-ROS-software.git
    ; ros2-sync-time-service debe instalarse manualmente

; Keep PlatformIO and IntelliSense on the C ports in lib/*_C.
lib_ignore =
    odom_helper
    robotito_omni
    ESP32Encoder_cpp
    fpid_cpp
    odom_helper_cpp
    robotito_omni_cpp
    robotito_vl53ring_cpp
